# Dracula — tmux palette
#
# Colors only. The bar's layout, formats and defaults live in
# ~/.config/tmux/tmux.conf, which sources THIS file last — so anything set
# here overrides the defaults, for this theme alone.

set -g @thm_bg      "#282a36"
set -g @thm_surface "#343746"
set -g @thm_overlay "#44475a"
set -g @thm_muted   "#6272a4"
set -g @thm_text    "#f8f8f2"
set -g @thm_accent  "#bd93f9"
set -g @thm_warn    "#ff5555"

# These three are tmux "colour" options, not "style" options, so tmux will not
# expand #{@thm_*} in them ("bad colour"). Literal hexes required.
set -g display-panes-colour "#6272a4"
set -g display-panes-active-colour "#bd93f9"
set -g clock-mode-colour "#bd93f9"

# ── per-theme overrides ────────────────────────────────────────────────────
# Uncomment to change something for this theme only. Any option from
# ~/.config/tmux/tmux.conf works here. Common ones:
#
#   set -g status-position bottom     # move the bar, this theme only
#   set -g @thm_bar_bg "#343746"    # solid bar instead of transparent
#   set -g status-interval 3          # faster refresh
