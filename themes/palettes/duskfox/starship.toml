# duskfox — Starship palette
#
# The six roles the bar files reference, from the nightfox.nvim duskfox palette:
#
#   red / orange / yellow / green / blue / magenta
#
# crust is the text on every filled segment.
#
# The table is named `theme`, not after the colourscheme, so every bar file
# can say `palette = "theme"` without knowing which one is loaded. This file
# holds nothing but the table: TOML requires top-level keys before any table,
# and the bar half supplies those.

[palettes.theme]
red       = "#eb6f92"
peach     = "#ea9a97"
yellow    = "#f6c177"
green     = "#a3be8c"
sapphire  = "#569fba"
lavender  = "#c4a7e7"
crust     = "#191726"

# Text on each fill. This palette uses one dark colour throughout, so they
# all resolve to crust; a preset with a different foreground per segment sets
# them individually (see tokyonight-moon).
on_red       = "#191726"
on_peach     = "#191726"
on_yellow    = "#191726"
on_green     = "#191726"
on_sapphire  = "#191726"
on_lavender  = "#191726"

# The prompt character. Separate from the fills: a fill role can legitimately be
# a dark plate — tokyonight's `green` is a navy language block — and the ❯ sits
# on the terminal background, where that would be invisible.
ok          = "#a3be8c"
err         = "#eb6f92"
info        = "#c4a7e7"
