# Classic powerline bar
#
# Layout only. Colours come from the @thm_* options the selected THEME sets,
# so this file works with every theme. Sourced by ~/.config/tmux/tmux.conf
# just before the theme, via the themes/current-bar symlink.
#
# Switch with `bar-set classic`.
#
# Solid filled zones with hard arrow transitions. Every zone owns a background,
# so colour carries the structure. The loudest of the three.

setw -g window-status-separator " "

set -g status-left "#[fg=#{@thm_bg},bg=#{@thm_accent},bold] #S #[fg=#{@thm_accent},bg=#{@thm_bar_bg},nobold]"

setw -g window-status-format "#[fg=#{@thm_muted},bg=#{@thm_bar_bg}] #I #{?#{==:#{window_name},#{pane_current_command}}, ,}#W "

setw -g window-status-current-format "#[fg=#{@thm_surface},bg=#{@thm_bar_bg}]#[fg=#{@thm_accent},bg=#{@thm_surface}]#[fg=#{@thm_text},bg=#{@thm_surface},bold] #I #{?#{==:#{window_name},#{pane_current_command}}, ,}#W #[fg=#{@thm_surface},bg=#{@thm_bar_bg},nobold]"

set -g status-right "#{?client_prefix,#[fg=#{@thm_warn}#,bold]PREFIX #[nobold],}#[fg=#{@thm_overlay},bg=#{@thm_bar_bg}]#[fg=#{@thm_warn},bg=#{@thm_overlay}] #($HOME/.config/themes/tmux-alert)#[fg=#{@thm_muted},bg=#{@thm_overlay}]#($HOME/.config/themes/tmux-git '#{pane_current_path}')#[fg=#{@thm_accent},bg=#{@thm_overlay}]#[fg=#{@thm_bg},bg=#{@thm_accent},bold] %H:%M #[nobold]"
