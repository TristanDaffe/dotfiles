# Minimal bar — Starship
#
# No powerline at all: colour carried by the TEXT, nothing filled. The prompt
# equivalent of the transparent tmux bar, and the one bar that stays legible
# whatever the palette, since nothing sits on a coloured block.
#
# Colours are palette NAMES, defined by whichever palette theme-set selected.
# Composed with themes/current/starship.toml by themes/starship-build.
# Switch with `bar-set minimal`.

"$schema" = 'https://starship.rs/config-schema.json'

palette = "theme"

format = """
$os\
$directory\
$git_branch\
$git_status\
$nodejs\
$bun\
$rust\
$golang\
$php\
$java\
$kotlin\
$haskell\
$python\
$c\
$conda\
$docker_context\
$cmd_duration\
$line_break\
$character"""

[os]
disabled = false
style = "fg:red"
format = "[$symbol]($style)"

[os.symbols]
Macos = ""
Linux = "󰌽"
Arch = "󰣇"
Debian = "󰣚"
Ubuntu = "󰕈"
Fedora = "󰣛"
Manjaro = ""
Mint = "󰣭"
Alpine = ""
Raspbian = "󰐿"
Gentoo = "󰣨"
CentOS = ""
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
SUSE = ""
Windows = ""
Android = ""

[directory]
style = "fg:peach"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "fg:yellow"
format = '[$symbol $branch ]($style)'

[git_status]
style = "fg:yellow"
format = '[($all_status$ahead_behind )]($style)'

# Counts, not bare symbols: !3 rather than a lone !.
conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
untracked = "?${count}"
# A TOML literal string, and the $ escaped: in a starship format string $
# opens a variable, so a bare "$" renders as nothing at all -- which is why
# starship's own default stash symbol disappears here. Escaping needs \$,
# and a basic "..." string would reject \$ as an invalid TOML escape.
stashed = '\$${count}'
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[nodejs]
symbol = ""
style = "fg:green"
format = '[$symbol( $version) ]($style)'

[bun]
symbol = ""
style = "fg:green"
format = '[$symbol( $version) ]($style)'

[rust]
symbol = ""
style = "fg:green"
format = '[$symbol( $version) ]($style)'

[golang]
symbol = ""
style = "fg:green"
format = '[$symbol( $version) ]($style)'

[php]
symbol = ""
style = "fg:green"
format = '[$symbol( $version) ]($style)'

[java]
symbol = " "
style = "fg:green"
format = '[$symbol( $version) ]($style)'

[kotlin]
symbol = ""
style = "fg:green"
format = '[$symbol( $version) ]($style)'

[haskell]
symbol = ""
style = "fg:green"
format = '[$symbol( $version) ]($style)'

[python]
symbol = ""
style = "fg:green"
format = '[$symbol( $version) ]($style)'

[c]
symbol = " "
style = "fg:green"
format = '[$symbol( $version) ]($style)'

[conda]
symbol = " "
style = "fg:sapphire"
format = '[$symbol$environment ]($style)'
ignore_base = false

[docker_context]
symbol = ""
style = "fg:sapphire"
format = '[$symbol( $context) ]($style)'

[cmd_duration]
min_time = 500
style = "fg:lavender"
format = '[ $duration ]($style)'
disabled = false

# Two lines: the strip, then what you type on its own line below it.
[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[ ❯](bold fg:ok)'
error_symbol = '[ ❯](bold fg:err)'
vimcmd_symbol = '[ ❮](bold fg:ok)'
vimcmd_replace_one_symbol = '[ ❮](bold fg:info)'
vimcmd_replace_symbol = '[ ❮](bold fg:info)'
vimcmd_visual_symbol = '[ ❮](bold fg:info)'
