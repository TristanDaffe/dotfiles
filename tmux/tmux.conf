# ── terminal ───────────────────────────────────────────────────────────────
set -sa terminal-overrides ",xterm*:Tc"
set -s set-clipboard on
set -as terminal-features ',xterm-256color:clipboard'

# ── general ────────────────────────────────────────────────────────────────
set -g mouse on
setw -g mode-keys vi
set -g base-index 1
set -g pane-base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── keys ───────────────────────────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# ── default palette fallbacks ──────────────────────────────────────────────────────
set -g @thm_bar_bg  "default"
set -g @thm_bg      "#1c1c1c"
set -g @thm_surface "#333333"
set -g @thm_overlay "#444444"
set -g @thm_muted   "#888888"
set -g @thm_text    "#dddddd"
set -g @thm_accent  "#c4a7e7"
set -g @thm_warn    "#eb6f92"

# ── status bar ─────────────────────────────────────────────────────────────
# Layout:  dev │  1  nvim ·  2 shell │  main  14:32
#          \___/   \____________________/   \___________/
#         session          windows            relevancy + git + clock
#
# On top on purpose: nvim's lualine sits at the bottom, so tmux acts as a roof
# over the current context instead of stacking two bars on each other.

set -g status on
set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-style "fg=#{@thm_muted},bg=#{@thm_bar_bg}"
set -g status-left-length 40
set -g status-right-length 60
set -g status-left-style NONE
set -g status-right-style NONE

# zone 1 — session
set -g status-left "#[fg=#{@thm_accent},bold] #S #[fg=#{@thm_overlay},nobold]│"

# zone 2 — windows. Active window gets a STAR plus a one-step background lift,
# not a saturated fill: strong color reads well in a screenshot and gets tiring
# over a full day. The terminal icon appears only on windows you have NOT
# renamed (tmux auto-names those after the running process).
setw -g window-status-separator "#[fg=#{@thm_overlay},bg=#{@thm_bar_bg}]·"
setw -g window-status-format "#[fg=#{@thm_muted},bg=#{@thm_bar_bg}] #I #{?#{==:#{window_name},#{pane_current_command}}, ,}#W "
setw -g window-status-current-format "#[fg=#{@thm_text},bg=#{@thm_overlay}] #[fg=#{@thm_accent}]#[fg=#{@thm_text},bold] #I #{?#{==:#{window_name},#{pane_current_command}}, ,}#W #[nobold]"
setw -g window-status-activity-style "fg=#{@thm_accent},bg=#{@thm_bar_bg}"

# zone 3 — relevancy alert (silent unless it matters), git branch (vanishes
# outside a repo), clock. #() is async: paints empty once, fills next interval.
set -g status-right "#{?client_prefix,#[fg=#{@thm_accent}#,bold]PREFIX,}#[fg=#{@thm_overlay},nobold] │ #[fg=#{@thm_warn}]#($HOME/.config/themes/tmux-alert)#[fg=#{@thm_muted}]#($HOME/.config/themes/tmux-git '#{pane_current_path}')%H:%M "

# ── panes and messages ─────────────────────────────────────────────────────
set -g pane-border-style "fg=#{@thm_overlay}"
set -g pane-active-border-style "fg=#{@thm_accent}"
set -g message-style "fg=#{@thm_text},bg=#{@thm_overlay}"
set -g message-command-style "fg=#{@thm_text},bg=#{@thm_overlay}"
set -g mode-style "fg=#{@thm_text},bg=#{@thm_overlay}"

# ── bar layout ─────────────────────────────────────────────────────────────
source-file ~/.config/themes/current-bar/tmux.conf

# ── theme ──────────────────────────────────────────────────────────────────
source-file ~/.config/themes/current/tmux.conf

# tmux plugin manager
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm

set -g @plugin 'tmux-plugins/tmux-resurrect' # save and restore sessions between restarts
set -g @resurrect-strategy-nvim 'session' # save nvim sessions
set -g @plugin 'tmux-plugins/tmux-continuum' # continuous saving

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

